name: Build OmniRoute Production Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable image tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/huanvo25/omniroute

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable AMD64 runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          build-args: |
            OMNIROUTE_BUILD_MEMORY_MB=4096
            OMNIROUTE_BUILD_CPUS=2
          cache-from: type=gha
          cache-to: type=gha,mode=max
